name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint:
    # Keep this on ubuntu-slim: all lint checks run through GitHub Actions,
    # .NET, or standard shell tooling and do not need ubuntu-latest's larger
    # runner image.
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdownlint-cli2
        # Use the official action in CI so Markdown linting stays on the slim
        # runner without requiring Docker or a checked-in Node.js project.
        uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23.0.0
        with:
          config: .markdownlint-cli2.yaml
          globs: "**/*.md"

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: CruiserJumpPractice/packages.lock.json

      - name: Restore NuGet packages
        run: dotnet restore --locked-mode

      - name: Run dotnet format
        run: dotnet format --no-restore --verify-no-changes

      - name: Run dotnet format analyzers
        # Build runs Roslyn analyzers too; this step fails earlier when a
        # fixable analyzer diagnostic would change source.
        run: dotnet format analyzers --no-restore --verify-no-changes
